services:
  mysql:
    image: mysql:8.4
    container_name: eclinique-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eclinique
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: eclinique-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: eclinique
      MYSQLUSER: root
      MYSQLPASSWORD: root
    ports:
      - "8282:8282"

volumes:
  mysql_data:
