services:
  mysql:
    image: mysql:8.4
    container_name: eclinique-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eclinique}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD doit être défini}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME doit être défini}/eclinique-backend:${APP_VERSION:-latest}
    container_name: eclinique-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: ${MYSQL_DATABASE:-eclinique}
      MYSQLUSER: root
      MYSQLPASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD doit être défini}
    ports:
      - "8282:8282"

  frontend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME doit être défini}/eclinique-frontend:${APP_VERSION:-latest}
    container_name: eclinique-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
